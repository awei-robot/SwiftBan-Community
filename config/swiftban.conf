# ============================================================
# SwiftBan 配置文件
# 安装后路径: /etc/swiftban/swiftban.conf
# ============================================================

#---------------- 日志与状态 ----------------
# Nginx/Apache/NPM 日志目录（第一层 *access.log 及未压缩数字/日期轮转文件，仅读取最近3分钟修改的文件）
LOG_DIR="/root/proxy-manager/data/logs"
# 逐行自动识别；也可指定 npm_standard、npm_proxy、combined 或 apache_* 格式
LOG_FORMAT="auto"

# 状态目录（封禁列表、运行记录、独立演练结果、停止标记和白名单）
# stop 状态跨重启保留；使用 start 恢复。停止期间 TTL 继续计时。
STATE_DIR="/etc/swiftban/state"

#---------------- 检测窗口 ----------------
# 时间窗口（秒）。按日志中的时区偏移换算为 UTC，拒绝未来时间
WINDOW=7200

#---------------- 封禁阈值 ----------------
LIMIT_444=10         # 域名扫描（NPM 444）
LIMIT_SCAN=100       # 404/400 扫描（排除 SAFE_PATH）
LIMIT_EVILPATH=3     # 恶意路径/敏感文件
LIMIT_PAYLOAD=2      # 漏洞载荷（SQL/XSS/Log4j/穿越/命令注入）
LIMIT_UA=5           # 可疑 UA
LIMIT_AUTH=20        # 登录爆破（登录路径 401/403）
LIMIT_API=200        # 单接口高频（IP + 域名 + 完整 URI，窗口内总量，仅告警）
LIMIT_API_RATE=30    # 单接口速率（次/分钟，仅告警，不单独封禁）
LIMIT_EMPTYUA=20     # 空 UA（自动化工具）
LIMIT_HIGHFREQ=500   # 高频观察（仅记录，不封禁）

#---------------- 封禁策略 ----------------
# 封禁时长（秒），0=永久
BAN_TTL=259200

# 防火墙链（Docker 端口映射流量走 FORWARD，必须用 DOCKER-USER）
FIREWALL_CHAIN="DOCKER-USER"

#---------------- 白名单 ----------------
# 内网/可信 IP（逗号分隔，精确匹配）
WHITELIST="127.0.0.1,::1,192.168.224.1,172.17.0.1"

# 白名单文件（每行 IP 或 CIDR，# 注释；优先级高于脚本内 WHITELIST）
WHITELIST_FILE=""

#---------------- 特征库 ----------------
# 正常路径（这些路径的 404 不视为扫描）
SAFE_PATH='/TDT/'

# Git 协议正常路径（排除误伤）
GIT_SAFE='git-upload-pack|git-receive-pack|info/refs'

# 恶意路径/敏感文件
EVIL_PATH='wp-admin|wp-login|wp-config|xmlrpc\.php|phpmyadmin|myadmin|\.env|/\.git/(config|HEAD|index|logs)|/\.svn|\.ssh/id_rsa|etc/passwd|etc/shadow|proc/self|actuator|solr|druid|api/jsonws|vendor/phpunit|config\.php|admin\.php|shell\.php|eval\(|base64_decode|get_people_for_id|\.sql|\.zip|\.tar\.gz|\.rar|\.7z|backup|dump'

# 漏洞载荷
EVIL_PAYLOAD='union.*select|select.*from|insert.*into|delete.*from|update.*set|sleep\(|benchmark\(|<script>|alert\(|document\.cookie|onerror=|onload=|\$\{jndi:|\.\./|\.\.%2f|%2e%2e|cmd=|exec=|shell=|system\(|passthru\('

# 可疑 UA
EVIL_UA='sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|wfuzz|burp|acunetix|nessus|openvas|python-requests|libwww|go-http'

# 登录路径（用于爆破检测）
LOGIN_PATH='login|signin|sign-in|auth|token'

# WATCH 观察记录保留天数（正式和演练分别保存）
WATCH_RETENTION_DAYS=7
